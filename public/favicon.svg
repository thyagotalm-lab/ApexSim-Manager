<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180406" />
      <stop offset="50%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle with racing red outline -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Speed racing grid stripes subtle background -->
  <path d="M12 96 L116 96" stroke="#261014" stroke-width="2" opacity="0.6" />
  <path d="M16 102 L112 102" stroke="#261014" stroke-width="2" opacity="0.6" />

  <!-- Outer Apex Chevron (Racing Red) -->
  <path d="M 22 96 L 64 22 L 106 96" 
        fill="none" 
        stroke="#ef4444" 
        stroke-width="11" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neonGlow)" />

  <!-- Inner Chevron (Pure Racing White) -->
  <path d="M 40 80 L 64 38 L 88 80" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Center Apex Core Point (Crimson Glow) -->
  <circle cx="64" cy="62" r="9" fill="#ef4444" filter="url(#neonGlow)" />
  <circle cx="64" cy="62" r="4.5" fill="#ffffff" />

  <!-- Racing Curb / Finish Baseline -->
  <path d="M 18 108 H 110" 
        stroke="#ef4444" 
        stroke-width="6" 
        stroke-linecap="round" 
        filter="url(#neonGlow)" />
</svg>
